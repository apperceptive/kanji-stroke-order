<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nihongoism related kanji</title>
<style>
{{STYLE}}
h2.rel{font-family:var(--heading);font-size:15px;margin:0;color:var(--muted);font-weight:700}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.row2{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-left-width:5px;border-radius:10px;background:#fff}
.row2.phonetic-series{border-left-color:var(--sound)}
.row2.shares-part{border-left-color:var(--part)}
.row2.built-on{border-left-color:var(--built)}
.row2 .k{font-family:var(--kanji);font-size:30px;line-height:1;text-align:center}
.row2 .what{display:grid;gap:1px;min-width:0}
.row2 .what b{font-weight:600}
.row2 .why{font-size:13px;color:var(--muted)}
.row2 .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.row2 .tag.new{color:var(--brick-dark);border-color:var(--brick)}
</style>
</head>
<body>
<main class="card" aria-label="Related kanji">
  <header class="top">
    <h1 class="title"><span class="jp" id="kj" style="font-size:22px"></span> <span id="gl" class="sub"></span></h1>
    <div class="right"><span class="sub" id="meta"></span></div>
  </header>
  <h2 class="rel" id="rel"></h2>
  <ul class="rows" id="rows"></ul>
  <div class="says" id="says"></div>
  <p class="note" id="note" aria-live="polite"></p>
  <p class="err" id="err" hidden></p>
{{FOOTER}}
</main>
<script>
{{SCRIPT}}
</script>
</body>
</html>
