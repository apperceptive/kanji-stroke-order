<!DOCTYPE html>

<style>
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: sans-serif;
    color: #eee;
  }
  h1 { font-size: 1.1rem; letter-spacing: 0.1em; margin-bottom: 0.5rem; color: #aaa; }
  .reading { font-size: 0.9rem; color: #888; margin-bottom: 1.2rem; }
  svg {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    overflow: visible;
  }
  #btn {
    margin-top: 1.5rem;
    padding: 0.6rem 2rem;
    background: #c0392b;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.2s;
  }
  #btn:hover { background: #a93226; }
  .legend {
    display: flex;
    gap: 1.2rem;
    margin-top: 1.2rem;
    font-size: 0.8rem;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 400px;
  }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .swatch { width: 20px; height: 4px; border-radius: 2px; }
</style>
</head>
<body>

<h1>Stroke Order — 順</h1>
<div class="reading">jun / shita·gau &nbsp;·&nbsp; order, sequence, obedience &nbsp;·&nbsp; 12 strokes</div>

<svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 109" width="360" height="360">
  <g id="kvg:StrokePaths_09806" style="fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;">
    <g id="kvg:09806" kvg:element="順">
      <!-- 川 (left radical) — strokes 1–3 -->
      <g id="kvg:09806-g1" kvg:element="川">
        <path id="kvg:09806-s1"  d="M20.84,26.93c1.12,1.12,1.57,2.5,1.57,4.56c0,26.64,1.21,43.89-8.78,57.67"/>
        <path id="kvg:09806-s2"  d="M33.25,24.88c0.94,0.94,1.16,2.37,1.16,3.9c0,0.56-0.09,22.62-0.12,34.59c-0.01,3.37-0.02,5.94-0.02,7.01"/>
        <path id="kvg:09806-s3"  d="M44.81,20.13c1.03,1.03,1.51,2.49,1.51,4c0,0.76,0,42.21,0,59.12c0,3.33,0,5.71,0,6.63"/>
      </g>
      <!-- 頁 (right radical) — strokes 4–12 -->
      <g id="kvg:09806-g2" kvg:element="頁">
        <path id="kvg:09806-s4"  d="M57.38,17.48c2.18,0.4,3.78,0.51,5.98,0.33c6.96-0.58,19.3-1.83,26.39-2.37c1.91-0.15,4.01-0.47,5.88,0.1"/>
        <path id="kvg:09806-s5"  d="M77.42,19.52c0.07,0.78-0.21,1.82-0.59,2.51c-1.83,3.34-3.08,5.84-7.27,10.34"/>
        <g id="kvg:09806-g3" kvg:element="貝">
          <!-- 目 (top of 貝) — strokes 6–10 -->
          <g id="kvg:09806-g4" kvg:element="目">
            <path id="kvg:09806-s6"  d="M62.09,32.55c0.74,0.74,1.12,2.05,1.12,3.42c0,6.53-0.04,25.45-0.05,34.4c0,1.53,0,2.77,0,3.61"/>
            <path id="kvg:09806-s7"  d="M64.22,34.67c5.13-0.82,18.55-3.23,23.15-3.81c2.88-0.36,4.62,1.14,4.62,3.27c0,2.62-0.05,19.46-0.01,34.12c0,1.82,0.01,3.58,0.01,5.25"/>
            <path id="kvg:09806-s8"  d="M64.43,46.5c7.82-1.25,17.32-2.5,26.51-3.49"/>
            <path id="kvg:09806-s9"  d="M64.14,58.9C70.75,58,82,56.5,90.22,55.89"/>
            <path id="kvg:09806-s10" d="M64.55,71.8c6.2-0.55,18.84-1.69,26.33-2.21"/>
          </g>
          <!-- 八 (bottom of 貝) — strokes 11–12 -->
          <g id="kvg:09806-g5" kvg:element="八">
            <path id="kvg:09806-s11" d="M71.38,77.75c0.12,1.12-0.37,2.34-1.2,3.27c-2.5,2.8-10.22,9.67-15.23,12.98"/>
            <path id="kvg:09806-s12" d="M83.93,77.15c5.49,4.35,11.97,12.23,13.46,16.04"/>

    </g>
  </g>
  <g id="kvg:StrokeNumbers_09806" style="font-size:8px;fill:#aaa;opacity:0">
    <text transform="matrix(1 0 0 1 13.50 27.50)">1</text>
    <text transform="matrix(1 0 0 1 24.50 24.50)">2</text>
    <text transform="matrix(1 0 0 1 35.50 20.50)">3</text>
    <text transform="matrix(1 0 0 1 53.50 14.50)">4</text>
    <text transform="matrix(1 0 0 1 83.25 25.63)">5</text>
    <text transform="matrix(1 0 0 1 54.75 40.63)">6</text>
    <text transform="matrix(1 0 0 1 63.49 31.18)">7</text>
    <text transform="matrix(1 0 0 1 67.50 43.63)">8</text>
    <text transform="matrix(1 0 0 1 67.50 55.63)">9</text>
    <text transform="matrix(1 0 0 1 66.50 69.13)">10</text>
    <text transform="matrix(1 0 0 1 57.50 84.50)">11</text>

<div class="legend">
  <div class="legend-item"><div class="swatch" style="background:#e74c3c"></div> 川 (1–3)</div>
  <div class="legend-item"><div class="swatch" style="background:#e67e22"></div> 頁 top (4–5)</div>
  <div class="legend-item"><div class="swatch" style="background:#2980b9"></div> 目 (6–10)</div>
  <div class="legend-item"><div class="swatch" style="background:#27ae60"></div> 八 (11–12)</div>
</div>

<button id="btn" onclick="play()">▶ Replay</button>

<script>
  const STROKE_DURATION = 500;
  const GAP = 150;

  const COLORS = {
    's1': '#e74c3c', 's2': '#e74c3c', 's3': '#e74c3c',
    's4': '#e67e22', 's5': '#e67e22',
    's6': '#2980b9', 's7': '#2980b9', 's8': '#2980b9', 's9': '#2980b9', 's10': '#2980b9',
    's11': '#27ae60', 's12': '#27ae60',
  };

  const strokeIds = Object.keys(COLORS).map(k => `kvg:09806-${k}`);

  function initStrokes() {
    strokeIds.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const key = id.replace('kvg:09806-', '');
      el.setAttribute('stroke', COLORS[key]);
      const len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      el.style.transition = 'none';
      el.style.opacity = '1';
    });
    document.getElementById('kvg:StrokeNumbers_09806').style.opacity = '0';
  }

  function play() {
    initStrokes();
    // force reflow
    document.getElementById('svg').getBoundingClientRect();

    strokeIds.forEach((id, i) => {
      const el = document.getElementById(id);
      if (!el) return;
      setTimeout(() => {
        el.style.transition = `stroke-dashoffset ${STROKE_DURATION}ms ease`;
        el.style.strokeDashoffset = '0';
      }, i * (STROKE_DURATION + GAP));
    });

    // Show numbers after all strokes done
    const totalTime = strokeIds.length * (STROKE_DURATION + GAP);
    setTimeout(() => {
      const nums = document.getElementById('kvg:StrokeNumbers_09806');
      nums.style.transition = 'opacity 0.4s';
      nums.style.opacity = '1';
    }, totalTime);
  }

  window.addEventListener('load', () => {
    initStrokes();
    setTimeout(play, 300);
  });
</script>
</body>
</html>
