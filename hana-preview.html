<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>自 — Stroke Order</title>
<style>
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: sans-serif;
    color: #eee;
  }
  h1 { font-size: 1.1rem; letter-spacing: 0.1em; margin-bottom: 0.5rem; color: #aaa; }
  .reading { font-size: 0.9rem; color: #888; margin-bottom: 1.2rem; }
  svg {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #btn {
    margin-top: 1.5rem;
    padding: 0.6rem 2rem;
    background: #c0392b;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.2s;
  }
  #btn:hover { background: #a93226; }
  .legend {
    display: flex;
    gap: 1.5rem;
    margin-top: 1.2rem;
    font-size: 0.85rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .swatch { width: 20px; height: 4px; border-radius: 2px; }
</style>
</head>
<body>

<h1>Stroke Order — 自</h1>
<div class="reading">ji / mizuka·ra &nbsp;·&nbsp; self, oneself &nbsp;·&nbsp; 6 strokes</div>

<svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 109 109" width="360" height="360">
  <g style="fill:none;stroke-width:1.5;stroke-linecap:butt;stroke-linejoin:miter;">
    <path id="s1" d="M50.44,12.42c0.31,1.42,0.34,2.13-0.24,3.9c-1.45,4.43-3.45,7.55-7.56,13.43"/>
    <path id="s2" d="M27.5,31.73c0.8,1.43,1.48,2.99,1.48,4.89c0,1.9-0.29,53.82-0.29,54.78c0,0.95,0.04,2.85,0.04,4.85"/>
    <path id="s3" d="M29.77,33.17c11.61-1.29,37.98-4.04,43.35-4.67c4.85-0.57,6.38,1,6.38,4.59c0,2.04-0.69,33.61-0.82,55.16c-0.01,2.4-0.02,4.68-0.02,6.78"/>
    <path id="s4" d="M30.23,51.23c11.14-1.1,37.27-3.48,47.79-3.77"/>
    <path id="s5" d="M30.11,70.17C44.5,68.75,62,67.25,77.74,66.31"/>
    <path id="s6" d="M29.79,91.57c12.59-0.69,34.84-2.32,47.46-3.13"/>
  </g>
</svg>

<div class="legend">
  <div class="legend-item"><div class="swatch" style="background:#e74c3c"></div> initial stroke (1)</div>
  <div class="legend-item"><div class="swatch" style="background:#2980b9"></div> 目 enclosure (2–3)</div>
  <div class="legend-item"><div class="swatch" style="background:#27ae60"></div> horizontals (4–6)</div>
</div>

<button id="btn" onclick="play()">▶ Replay</button>

<script>
  const STROKE_DURATION = 500;
  const GAP = 150;

  const COLORS = {
    's1': '#e74c3c',
    's2': '#2980b9', 's3': '#2980b9',
    's4': '#27ae60', 's5': '#27ae60', 's6': '#27ae60',
  };

  const strokeIds = ['s1','s2','s3','s4','s5','s6'];

  function initStrokes() {
    strokeIds.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.setAttribute('stroke', COLORS[id]);
      const len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
      el.style.transition = 'none';
    });
  }

  function play() {
    initStrokes();
    document.getElementById('svg').getBoundingClientRect();
    strokeIds.forEach((id, i) => {
      const el = document.getElementById(id);
      if (!el) return;
      setTimeout(() => {
        el.style.transition = `stroke-dashoffset ${STROKE_DURATION}ms ease`;
        el.style.strokeDashoffset = '0';
      }, i * (STROKE_DURATION + GAP));
    });
  }

  window.addEventListener('load', () => {
    initStrokes();
    setTimeout(play, 300);
  });
</script>
</body>
</html>
